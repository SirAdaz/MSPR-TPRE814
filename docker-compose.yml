services:
  postgres-auth:
    image: postgres:16
    environment:
      POSTGRES_USER: futurekawa
      POSTGRES_PASSWORD: futurekawa
      POSTGRES_DB: futurekawa_auth
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futurekawa -d futurekawa_auth"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres-br:
    image: postgres:16
    environment:
      POSTGRES_USER: futurekawa
      POSTGRES_PASSWORD: futurekawa
      POSTGRES_DB: futurekawa_br
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futurekawa -d futurekawa_br"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres-ec:
    image: postgres:16
    environment:
      POSTGRES_USER: futurekawa
      POSTGRES_PASSWORD: futurekawa
      POSTGRES_DB: futurekawa_ec
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futurekawa -d futurekawa_ec"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres-co:
    image: postgres:16
    environment:
      POSTGRES_USER: futurekawa
      POSTGRES_PASSWORD: futurekawa
      POSTGRES_DB: futurekawa_co
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futurekawa -d futurekawa_co"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mosquitto-br:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"

  mosquitto-ec:
    image: eclipse-mosquitto:2
    ports:
      - "1884:1883"

  mosquitto-co:
    image: eclipse-mosquitto:2
    ports:
      - "1885:1883"

  backend-br:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      COUNTRY_CODE: BR
      ENABLE_SCHEDULER: "true"
      ENABLE_MQTT: "false"
      ENABLE_SIMULATION: "true"
      ENABLE_ALERT_COOLDOWN: "true"
      ALERT_COOLDOWN_SECONDS: 0
      SIMULATION_ENVIRONMENT_INTERVAL_SECONDS: 45
      SIMULATION_LOGISTICS_INTERVAL_SECONDS: 90
      DATABASE_URL: postgresql://futurekawa:futurekawa@postgres-br:5432/futurekawa_br
      FRONTEND_API_KEY: front-dev-key
      SENSOR_API_KEY: sensor-dev-key
      MQTT_HOST: mosquitto-br
      MQTT_PORT: 1883
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      ALERT_EMAIL_TO: brazil.ops@futurekawa.local
      ALERT_EMAIL_BR: brazil.ops@futurekawa.local
      ALERT_EMAIL_EC: ecuador.ops@futurekawa.local
      ALERT_EMAIL_CO: colombia.ops@futurekawa.local
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    depends_on:
      postgres-br:
        condition: service_healthy
      mosquitto-br:
        condition: service_started
    ports:
      - "8001:8000"

  backend-ec:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      COUNTRY_CODE: EC
      ENABLE_SCHEDULER: "true"
      ENABLE_MQTT: "false"
      ENABLE_SIMULATION: "true"
      ENABLE_ALERT_COOLDOWN: "true"
      ALERT_COOLDOWN_SECONDS: 0
      SIMULATION_ENVIRONMENT_INTERVAL_SECONDS: 45
      SIMULATION_LOGISTICS_INTERVAL_SECONDS: 90
      DATABASE_URL: postgresql://futurekawa:futurekawa@postgres-ec:5432/futurekawa_ec
      FRONTEND_API_KEY: front-dev-key
      SENSOR_API_KEY: sensor-dev-key
      MQTT_HOST: mosquitto-ec
      MQTT_PORT: 1883
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      ALERT_EMAIL_TO: ecuador.ops@futurekawa.local
      ALERT_EMAIL_BR: brazil.ops@futurekawa.local
      ALERT_EMAIL_EC: ecuador.ops@futurekawa.local
      ALERT_EMAIL_CO: colombia.ops@futurekawa.local
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    depends_on:
      postgres-ec:
        condition: service_healthy
      mosquitto-ec:
        condition: service_started
    ports:
      - "8002:8000"

  backend-co:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      COUNTRY_CODE: CO
      ENABLE_SCHEDULER: "true"
      ENABLE_MQTT: "false"
      ENABLE_SIMULATION: "true"
      ENABLE_ALERT_COOLDOWN: "true"
      ALERT_COOLDOWN_SECONDS: 0
      SIMULATION_ENVIRONMENT_INTERVAL_SECONDS: 45
      SIMULATION_LOGISTICS_INTERVAL_SECONDS: 90
      DATABASE_URL: postgresql://futurekawa:futurekawa@postgres-co:5432/futurekawa_co
      FRONTEND_API_KEY: front-dev-key
      SENSOR_API_KEY: sensor-dev-key
      MQTT_HOST: mosquitto-co
      MQTT_PORT: 1883
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      ALERT_EMAIL_TO: colombia.ops@futurekawa.local
      ALERT_EMAIL_BR: brazil.ops@futurekawa.local
      ALERT_EMAIL_EC: ecuador.ops@futurekawa.local
      ALERT_EMAIL_CO: colombia.ops@futurekawa.local
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    depends_on:
      postgres-co:
        condition: service_healthy
      mosquitto-co:
        condition: service_started
    ports:
      - "8003:8000"

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  jenkins:
    build: ./jenkins
    user: root
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc/jenkins.yaml
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      JENKINS_ADMIN_ID: admin
      JENKINS_ADMIN_PASSWORD: admin123
      JENKINS_URL: http://localhost:8080/
    ports:
      - "8080:8080"
      - "50000:50000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace/project:ro
      - ./jenkins/casc:/var/jenkins_home/casc:ro

  frontend:
    image: node:22
    command: sh -c "npm install && until npx prisma migrate deploy; do echo 'Waiting for auth database...' && sleep 2; done && npx prisma generate && npm run dev -- --hostname 0.0.0.0 --port 3000 & NEXT_PID=$$! && node ./scripts/init-admin-user.mjs && wait $$NEXT_PID"
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      BACKEND_BR_URL: http://backend-br:8000
      BACKEND_EC_URL: http://backend-ec:8000
      BACKEND_CO_URL: http://backend-co:8000
      FRONTEND_API_KEY: front-dev-key
      AUTH_DATABASE_URL: postgresql://futurekawa:futurekawa@postgres-auth:5432/futurekawa_auth
      BETTER_AUTH_SECRET: dev-better-auth-secret-32-characters-minimum!
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_URL_INTERNAL: http://127.0.0.1:3000
      DEFAULT_ADMIN_EMAIL: admin@futurekawa.local
      DEFAULT_ADMIN_PASSWORD: Admin123!
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/login',{redirect:'manual'}).then((r)=>process.exit((r.status===200||r.status===307)?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    depends_on:
      postgres-auth:
        condition: service_healthy
      backend-br:
        condition: service_healthy
      backend-ec:
        condition: service_healthy
      backend-co:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  jenkins_home:
  frontend_node_modules:
